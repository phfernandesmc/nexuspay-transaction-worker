# A maior parte dos valores abaixo tem um padrao (o formato ${VAR:padrao}) para
# que o worker suba localmente sem nenhuma variavel de ambiente configurada. Em
# producao (Fatia 4), as variaveis de ambiente sobrescrevem os padroes — o
# arquivo fica versionado no GitHub e nao pode carregar credencial nem
# identificador de conta real em texto claro.
#
# EXCECAO deliberada: nexuspay.sqs.queue-url NAO tem padrao. Ter, como tinha,
# significava que qualquer contexto Spring subido sem o perfil de teste — um
# @SpringBootTest novo que esquecesse @ActiveProfiles("test"), por exemplo —
# apontava um consumidor VIVO para a fila real de producao. O que impedia isso
# era so application-test.yml, carregado por uma anotacao que alguem precisa
# lembrar de escrever: convencao, nao mecanismo. Sem padrao, esse contexto
# falha no boot com "Could not resolve placeholder", que e o comportamento
# certo — o worker so consome a fila quando alguem disse explicitamente qual.
#
# A CREDENCIAL (nexuspay.aws.*) segue a mesma exigencia de "nunca implicita",
# mas por outro mecanismo: os tres campos tem default VAZIO aqui — de proposito,
# para o placeholder sempre resolver — e e AwsConfig.java que valida na hora de
# montar o bean, recusando com um erro proprio se nem perfil nem access
# key/secret estiverem configurados. Access key/secret e o caminho de
# PRODUCAO — Render, Fly e toda PaaS equivalente passam segredo como variavel
# de ambiente comum, sem a convencao de "perfil nomeado" de ~/.aws/credentials.
# Perfil continua sendo o caminho de DESENVOLVIMENTO.
spring:
  application:
    name: nexuspay-transaction-worker
  datasource:
    # A porta e 5433, nao 5432: maquinas Windows com servico nativo
    # postgresql-x64-* costumam ocupar a 5432, e o docker-compose.yml do
    # gateway ja mapeia 5433.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nexuspay}
    username: ${DATABASE_USER:nexuspay}
    password: ${DATABASE_PASSWORD:nexuspay}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

nexuspay:
  aws:
    profile: ${AWS_PROFILE:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  sqs:
    queue-url: ${SQS_QUEUE_URL}
