# A maior parte dos valores abaixo tem um padrao (o formato ${VAR:padrao}) para
# que o worker suba localmente sem nenhuma variavel de ambiente configurada. Em
# producao (Fatia 4), as variaveis de ambiente sobrescrevem os padroes — o
# arquivo fica versionado no GitHub e nao pode carregar credencial nem
# identificador de conta real em texto claro.
#
# DUAS EXCECOES deliberadas: nexuspay.sqs.queue-url e nexuspay.aws.profile NAO
# tem padrao. Ter, como tinham, significava que qualquer contexto Spring subido
# sem o perfil de teste — um @SpringBootTest novo que esquecesse
# @ActiveProfiles("test"), por exemplo — apontava um consumidor VIVO para a fila
# real de producao, assinado com a credencial real, e a suite ficava verde
# comendo mensagem de verdade. O que impedia isso era so application-test.yml,
# carregado por uma anotacao que alguem precisa lembrar de escrever: convencao,
# nao mecanismo. Sem padrao, esse contexto falha no boot com "Could not resolve
# placeholder", que e o comportamento certo — o worker so consome a fila e so
# assina requisicao quando alguem disse explicitamente com o que. A Fatia 4
# injeta as duas variaveis no deploy.
spring:
  application:
    name: nexuspay-transaction-worker
  datasource:
    # A porta e 5433, nao 5432: maquinas Windows com servico nativo
    # postgresql-x64-* costumam ocupar a 5432, e o docker-compose.yml do
    # gateway ja mapeia 5433.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nexuspay}
    username: ${DATABASE_USER:nexuspay}
    password: ${DATABASE_PASSWORD:nexuspay}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

nexuspay:
  aws:
    profile: ${AWS_PROFILE}
  sqs:
    queue-url: ${SQS_QUEUE_URL}
